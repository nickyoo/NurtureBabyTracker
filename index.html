<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover for the safe-area insets; pinch-zoom stays allowed. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Fallback for hosts without our netlify.toml headers. frame-ancestors
       can't be set from a meta tag; Netlify sends it as a header. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Nurture</title>
  <meta name="description" content="Free. Private. Everything stays on this phone. A calm baby tracker for feeds, sleep, diapers, pumping and your milk stash. Works offline, no account.">
  <meta name="color-scheme" content="light dark">
  <!-- = --bg in each theme; app.js keeps both in step with the theme it applies. -->
  <meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191512" media="(prefers-color-scheme: dark)">
  <!-- Blocking on purpose: sets <html data-theme> before first paint (CSP: no inline scripts). -->
  <script src="js/theme-boot.js"></script>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nurture">
  <meta name="application-name" content="Nurture">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.json">
  <!-- Swappable: onboarding / Settings → Baby set the baby's photo here (iPhone). -->
  <link rel="apple-touch-icon" id="appleTouchIcon" href="icons/apple-touch-icon.png">
  <link rel="icon" id="favicon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="preload" href="fonts/nunito-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-soft-latin-wght-opsz.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views/today.css">
  <link rel="stylesheet" href="css/views/timeline.css">
  <link rel="stylesheet" href="css/views/stash.css">
  <link rel="stylesheet" href="css/views/memories.css">
  <link rel="stylesheet" href="css/views/settings.css">
  <link rel="stylesheet" href="css/views/onboarding.css">
  <link rel="stylesheet" href="css/views/report.css">
  <link rel="stylesheet" href="css/sheets/quicklog.css">
  <link rel="stylesheet" href="css/sheets/feed.css">
  <link rel="stylesheet" href="css/sheets/pump.css">
  <link rel="stylesheet" href="css/sheets/sleep.css">
  <link rel="stylesheet" href="css/sheets/diaper.css">
  <link rel="stylesheet" href="css/sheets/event.css">
  <link rel="stylesheet" href="css/sheets/stash.css">
  <link rel="stylesheet" href="css/sheets/memory.css">

  <script type="module" src="js/app.js"></script>
</head>
<body data-chrome="boot">
  <div id="app">                          <!-- inert while a sheet is open -->
    <header id="appHeader"></header>      <!-- status-bar zone; views render their own headers -->
    <main id="viewport"></main>           <!-- each tab / screen mounts a scrolling section here -->
    <div id="livePills"></div>            <!-- one pill per running activity -->
    <nav id="tabBar"></nav>               <!-- Today · Timeline · (+) · Stash · Memories -->
  </div>
  <div id="sheetRoot"></div>
  <div id="toastRoot" role="status" aria-live="polite"></div>
  <noscript><p class="boot-msg">Nurture needs JavaScript to run. Everything it stores stays on this phone.</p></noscript>
</body>
</html>
