<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Luxurious Ballet Blush Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7fa" />
      <stop offset="50%" stop-color="#fdf2f7" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>

    <!-- Liquid Milk Pink Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f9" />
      <stop offset="40%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Rose Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#e2b79a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#e65c8e" flood-opacity="0.25" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.06" />
    </filter>

    <!-- Inner Bottle Clip Path -->
    <clipPath id="bottleClip">
      <path d="M 205 170 
               C 205 170, 160 215, 160 270 
               L 160 380 
               C 160 410, 185 425, 256 425 
               C 327 425, 352 410, 352 380 
               L 352 270 
               C 352 215, 307 170, 307 170 Z" />
    </clipPath>
  </defs>

  <!-- App Squircle Base with Delicate Double Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#f3bad0" stroke-width="4" filter="url(#cardShadow)"/>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#e2b79a" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.65"/>

  <!-- Ethereal Angel / Cherub Wings Branching Behind the Bottle -->
  <g stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45">
    <!-- Left Wing -->
    <path d="M 170 230 C 120 180, 70 140, 50 180 C 35 210, 60 245, 100 260 C 130 272, 160 275, 175 275" />
    <path d="M 68 195 C 90 220, 125 240, 155 250" stroke-width="1.8" />
    <path d="M 85 165 C 110 195, 140 220, 165 235" stroke-width="1.8" />

    <!-- Right Wing -->
    <path d="M 342 230 C 392 180, 442 140, 462 180 C 477 210, 452 245, 412 260 C 382 272, 352 275, 337 275" />
    <path d="M 444 195 C 422 220, 387 240, 357 250" stroke-width="1.8" />
    <path d="M 427 165 C 402 195, 372 220, 347 235" stroke-width="1.8" />
  </g>

  <!-- Central Glass Bottle Hero -->
  <g filter="url(#softGlow)">
    <!-- Teat / Nipple in Rose Gold -->
    <path d="M 232 90 C 232 80, 242 72, 256 72 C 270 72, 280 80, 280 90 L 286 112 L 226 112 Z" fill="#ffe4e6" stroke="#e2b79a" stroke-width="3" stroke-linejoin="round"/>
    <!-- Collar Cap -->
    <rect x="214" y="112" width="84" height="28" rx="8" fill="#fce7f3" stroke="#e65c8e" stroke-width="3"/>

    <!-- Glass Body Silhouette -->
    <path d="M 205 140 L 307 140 L 312 170 
             C 312 170, 352 215, 352 270 
             L 352 380 
             C 352 410, 327 425, 256 425 
             C 185 425, 160 410, 160 380 
             L 160 270 
             C 160 215, 200 170, 200 170 Z" 
          fill="#ffffff" 
          stroke="#f472b6" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>

    <!-- Clipped Liquid Milk Layer (Rising to 65%) -->
    <g clip-path="url(#bottleClip)">
      <rect x="150" y="245" width="212" height="190" fill="url(#liquidGrad)"/>
      <!-- Liquid Wave Crest -->
      <path d="M 150 248 C 180 240, 210 256, 240 248 C 270 240, 300 256, 330 248 C 345 244, 360 248, 365 250 L 365 265 L 150 265 Z" fill="#ffffff" opacity="0.85"/>
      <!-- Soft Heart Glowing Inside the Milk -->
      <path d="M 256 320 
               C 256 320, 236 298, 222 312 
               C 208 326, 218 350, 256 376 
               C 294 350, 304 326, 290 312 
               C 276 298, 256 320, 256 320 Z" 
            fill="#ffffff" 
            opacity="0.95" 
            filter="drop-shadow(0 2px 6px rgba(230, 92, 142, 0.3))"/>
    </g>

    <!-- Glass Reflection Highlight (Curved Shine) -->
    <path d="M 182 250 L 182 370" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 194 260 L 194 350" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Measurement Markings in Rose Gold -->
    <line x1="324" y1="365" x2="338" y2="365" stroke="#e2b79a" stroke-width="3" stroke-linecap="round"/>
    <line x1="320" y1="325" x2="338" y2="325" stroke="#e2b79a" stroke-width="3" stroke-linecap="round"/>
    <line x1="324" y1="285" x2="338" y2="285" stroke="#e2b79a" stroke-width="3" stroke-linecap="round"/>
    <line x1="318" y1="245" x2="338" y2="245" stroke="#e65c8e" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Coquette Ribbon Bow Tied Gracefully on the Bottle Collar -->
  <g filter="url(#cardShadow)">
    <!-- Center Knot -->
    <ellipse cx="256" cy="155" rx="8" ry="7" fill="#db2777" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Left Loop -->
    <path d="M 250 154 
             C 220 134, 185 130, 180 146 
             C 175 162, 205 170, 250 158 Z" 
          fill="url(#ribbonGrad)" 
          stroke="#ffffff" 
          stroke-width="1.8"/>
    
    <!-- Right Loop -->
    <path d="M 262 154 
             C 292 134, 327 130, 332 146 
             C 337 162, 307 170, 262 158 Z" 
          fill="url(#ribbonGrad)" 
          stroke="#ffffff" 
          stroke-width="1.8"/>

    <!-- Trailing Ribbon Tails -->
    <path d="M 250 160 C 238 180, 222 205, 205 215 C 200 218, 208 214, 214 205 L 252 162" fill="#be185d" opacity="0.9"/>
    <path d="M 262 160 C 274 180, 290 205, 307 215 C 312 218, 304 214, 298 205 L 260 162" fill="#be185d" opacity="0.9"/>
  </g>

  <!-- Romantic Sparkles, Petite Flowers, & Golden Stars -->
  <path d="M 390 85 L 394 97 L 406 101 L 394 105 L 390 117 L 386 105 L 374 101 L 386 97 Z" fill="#e2b79a"/>
  <path d="M 115 110 L 118 120 L 128 123 L 118 126 L 115 136 L 112 126 L 102 123 L 112 120 Z" fill="#e2b79a"/>
  
  <circle cx="110" cy="385" r="7" fill="#fbcfe8" stroke="#ec4899" stroke-width="1.5"/>
  <circle cx="110" cy="385" r="2.5" fill="#ffffff"/>
  <circle cx="400" cy="380" r="7" fill="#fbcfe8" stroke="#ec4899" stroke-width="1.5"/>
  <circle cx="400" cy="380" r="2.5" fill="#ffffff"/>

  <circle cx="130" cy="310" r="3" fill="#f472b6" opacity="0.7"/>
  <circle cx="380" cy="310" r="3" fill="#f472b6" opacity="0.7"/>
  <circle cx="256" cy="46" r="3" fill="#e2b79a" opacity="0.8"/>
</svg>
