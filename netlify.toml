# Nurture on Netlify — static PWA, no build step.
[build]
  publish = "."

# Privacy + hardening for every response (ARCHITECTURE §9). The CSP is the
# enforcement behind "no network requests after load": scripts, styles,
# fonts and connections are same-origin only, and nothing may frame the app
# except the owner's arcade (nickg.xyz). index.html carries the same policy
# as a <meta> fallback for other hosts (meta can't carry frame-ancestors).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://nickg.xyz https://*.nickg.xyz"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Content-Type-Options = "nosniff"

# Service worker must never be cached stale, or updates won't reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons and fonts are immutable: a changed file gets a new name.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS filenames are not content-hashed, so they must revalidate on every
# load (cheap: ETag -> 304). Marking them immutable meant a deploy's bug fixes
# could stay invisible to returning visitors for up to a year.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
