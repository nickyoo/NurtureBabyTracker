<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurture · Calm Oat</title>
<style>
/* ===== Fonts (self-hosted, latin subset, variable) ===== */
@font-face{font-family:"Nunito";src:url("fonts/nunito-latin-wght-normal.woff2") format("woff2");font-weight:200 1000;font-style:normal;font-display:block}
@font-face{font-family:"Fraunces";src:url("fonts/fraunces-latin-full-normal.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:block}

/* ===== Tokens — Calm Oat (light) ===== */
.frame{
  --ui:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Fraunces",ui-serif,Georgia,serif;
  --bg:#F6F1E8; --surface:#FFFCF7; --surface-2:#EFE8DC; --line:#E9DFD0; --line-strong:#958675;
  --text:#2B2420; --text-2:#665A4E; --text-3:#766A5D;
  --accent:#A6532F; --on-accent:#FFFCF7; --accent-soft:#F5E3D6; --accent-ink:#97492A;
  --feed-tint:#FCE7D4; --feed-ink:#9A5419; --feed-mid:#BA682E;
  --sleep-tint:#ECE7F5; --sleep-ink:#62558F; --sleep-mid:#8576B8;
  --diaper-tint:#E3ECDD; --diaper-ink:#4A6B47; --diaper-mid:#668960;
  --pump-tint:#F7E2E6; --pump-ink:#9C4459; --pump-mid:#BF6079;
  --mem-tint:#F7EDCD; --mem-ink:#7E6211; --mem-mid:#9C7A18;
  --warn-tint:#FBE9C8; --warn-ink:#7F5310; --ok-tint:#E3ECDD; --ok-ink:#46663F;
  --chip-on-tint:rgba(255,252,247,.78); --track-on-tint:rgba(43,36,32,.10);
  --nav-bg:#FFFCF7; --scrim:rgba(38,29,22,.46);
  --pill-bg:#2B2420; --pill-text:#F6EFE4; --pill-text-2:#C9BBAB; --pill-chip:rgba(231,166,115,.16); --pill-ink:#E7A673;
  --toggle-off:#D8CEC0; --knob:#FFFFFF; --fab-bg:var(--accent);
  --shadow-1:0 1px 2px rgba(60,40,20,.05),0 4px 14px -6px rgba(60,40,20,.10);
  --shadow-2:0 10px 30px -8px rgba(43,36,32,.38),0 2px 6px rgba(43,36,32,.12);
}
/* ===== Night ===== */
.frame.dark{
  --bg:#14110E; --surface:#1E1A16; --surface-2:#28221D; --line:#2E2822; --line-strong:#7E7163;
  --text:#D9CDBC; --text-2:#A89A89; --text-3:#9B8E7E;
  --accent:#D48660; --on-accent:#1C130E; --accent-soft:#3A281E; --accent-ink:#E39A74;
  --feed-tint:#33251A; --feed-ink:#E7A673; --feed-mid:#C07F52;
  --sleep-tint:#262236; --sleep-ink:#B2A6DE; --sleep-mid:#8B7EBF;
  --diaper-tint:#1F2A1F; --diaper-ink:#98BB91; --diaper-mid:#78986F;
  --pump-tint:#35212A; --pump-ink:#E098AA; --pump-mid:#BA6F83;
  --mem-tint:#30291A; --mem-ink:#D8B866; --mem-mid:#B39445;
  --warn-tint:#352A16; --warn-ink:#E2B565; --ok-tint:#1F2A1F; --ok-ink:#98BB91;
  --chip-on-tint:rgba(255,240,220,.07); --track-on-tint:rgba(255,240,220,.10);
  --nav-bg:#1A1613; --scrim:rgba(0,0,0,.6);
  --pill-bg:#2E2722; --pill-text:#D9CDBC; --pill-text-2:#A89A89;
  --toggle-off:#4A4038; --knob:#E8DDCE; --fab-bg:#B9714F;
  --shadow-1:0 0 0 1px rgba(255,240,220,.03);
  --shadow-2:0 10px 30px -8px rgba(0,0,0,.7),0 0 0 1px rgba(255,240,220,.06);
}
.cat-feed{--c-tint:var(--feed-tint);--c-ink:var(--feed-ink);--c-mid:var(--feed-mid)}
.cat-sleep{--c-tint:var(--sleep-tint);--c-ink:var(--sleep-ink);--c-mid:var(--sleep-mid)}
.cat-diaper{--c-tint:var(--diaper-tint);--c-ink:var(--diaper-ink);--c-mid:var(--diaper-mid)}
.cat-pump{--c-tint:var(--pump-tint);--c-ink:var(--pump-ink);--c-mid:var(--pump-mid)}
.cat-mem{--c-tint:var(--mem-tint);--c-ink:var(--mem-ink);--c-mid:var(--mem-mid)}
.cat-accent{--c-tint:var(--accent-soft);--c-ink:var(--accent-ink)}
.cat-neutral{--c-tint:var(--surface-2);--c-ink:var(--text-2)}

/* ===== Reset / board ===== */
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
ul{list-style:none}
body{background:#D3CCC1;font-family:"Nunito",system-ui,sans-serif;padding:40px 48px 64px;color:#2B2420}
.board-hd{margin-bottom:28px}
.board-hd h1{font-family:"Fraunces";font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:560;font-size:30px}
.board-hd h1 em{font-style:normal;color:#97492A}
.board-hd p{font-size:15px;font-weight:600;color:#4B4038;margin-top:4px}
.board{display:flex;gap:40px;align-items:flex-start;width:max-content}
.shot{display:flex;flex-direction:column;gap:12px;width:390px}
.cap{font:600 14px/1.35 "Nunito";color:#3D342D;min-height:40px;display:flex;gap:8px;align-items:flex-start}
.cap b{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#2B2420;color:#F6F1E8;font-size:12px;font-weight:800}

/* ===== Frame ===== */
.frame{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--ui);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;
  box-shadow:0 30px 60px -24px rgba(43,36,32,.4),0 0 0 1px rgba(43,36,32,.08)}
.disp{font-family:var(--display);font-variation-settings:"SOFT" 100,"WONK" 0;font-optical-sizing:auto;font-weight:560;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;flex:none}
.ic-s{width:18px;height:18px}
.ic-xs{width:14px;height:14px}

/* status bar + home indicator */
.sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:12px 26px 0 38px;font-weight:800;font-size:16px;z-index:6;font-variant-numeric:tabular-nums}
.sb-r{display:flex;gap:6px;align-items:center}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.85;z-index:12}
.screen{position:absolute;top:47px;left:0;right:0;bottom:0;padding:4px 20px 0;overflow:hidden}

/* ===== Today header ===== */
.today-hd{display:flex;align-items:center;gap:12px;height:64px}
.avatar-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.avatar{width:44px;height:44px;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-soft)}
.av-clara{background:
  radial-gradient(circle at 50% 45%,#F2D2BA 0 27%,transparent 28%),
  radial-gradient(ellipse 60% 34% at 50% 26%,#C9B9DD 0 70%,transparent 72%),
  radial-gradient(ellipse 70% 45% at 50% 108%,#E9B9A0 0 70%,transparent 72%),
  linear-gradient(160deg,#FBE8D4,#F0CDB2)}
.today-id{flex:1;min-width:0}
.today-id h1{font-size:28px;line-height:32px}
.today-id p{font-size:14px;color:var(--text-2);font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text-2);box-shadow:var(--shadow-1);flex:none}
.icon-btn .ic{width:22px;height:22px}
.icon-btn.accent{background:var(--accent);color:var(--on-accent);box-shadow:none}

/* ===== QuickLogCard ===== */
.ql-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.ql{background:var(--c-tint);border-radius:24px;padding:14px 14px 14px 16px;height:148px;display:flex;flex-direction:column}
.ql-top{display:flex;justify-content:space-between;align-items:center;height:32px}
.ql-label{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--c-ink)}
.ql-label .ic{width:20px;height:20px}
.ql-label .dot-live{margin-left:2px}
.ql-add{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--chip-on-tint);color:var(--c-ink)}
.ql-add .ic{width:18px;height:18px}
.ql-val{font-size:38px;line-height:42px;margin-top:12px;color:var(--text);white-space:nowrap}
.ql-val small{font-size:21px;color:var(--text-2);margin:0 3px 0 1px;font-weight:500}
.ql-sub{font-size:14px;font-weight:600;color:var(--text-2);white-space:nowrap}
.ql-sub b{color:var(--text);font-weight:800}
.goal{display:flex;align-items:center;gap:8px;margin-top:auto}
.goal-bar{flex:1;height:6px;border-radius:3px;background:var(--track-on-tint);overflow:hidden}
.goal-bar i{display:block;height:100%;background:var(--c-mid);border-radius:3px}
.goal-txt{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap}
.goal-txt small{color:var(--text-2);font-weight:700}
.dot-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}

/* ===== Section header / links ===== */
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;min-height:44px}
.sec-hd h2{font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.sec-hd.sm{margin:14px 0 4px;min-height:36px}
.sec-hd.st{margin:10px 2px 2px;min-height:34px}
.sec-hd.sm h2{font-size:16px}
.sec-hd .muted{color:var(--text-2);font-weight:700}
.muted{color:var(--text-2)}
.small{font-size:13px;font-weight:700}
.link{display:flex;align-items:center;gap:2px;height:44px;padding:0 2px 0 12px;color:var(--accent-ink);font-weight:800;font-size:15px}

/* ===== ListRow ===== */
.list{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-1);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px 10px 12px}
.list li+li .row::before{content:"";position:absolute;top:0;left:68px;right:16px;height:1px;background:var(--line)}
.row-time{width:44px;flex:none;font-weight:800;font-size:15px;line-height:1.1;display:flex;flex-direction:column;align-items:flex-end}
.row-time small{font-size:12px;font-weight:700;color:var(--text-3)}
.row-time+.chip-ic{margin-left:2px}
.list li+li .row-time ~ .row-main{}
.chip-ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--c-tint);color:var(--c-ink);flex:none}
.chip-ic .ic{width:22px;height:22px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{font-size:14px;color:var(--text-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;font-size:17px;white-space:nowrap}
.amt small{font-size:13px;color:var(--text-2);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--c-tint);color:var(--c-ink);font-weight:800;font-size:13px}
/* time column rows put the divider after the time */
.list li+li .row:has(.row-time)::before{left:72px}

/* ===== bottom chrome ===== */
.fade{position:absolute;left:0;right:0;bottom:90px;height:92px;background:linear-gradient(to bottom,transparent,var(--bg) 58%);pointer-events:none;z-index:2}
.live{position:absolute;left:16px;right:16px;bottom:104px;height:60px;border-radius:30px;background:var(--pill-bg);color:var(--pill-text);
  display:flex;align-items:center;gap:12px;padding:0 16px 0 8px;box-shadow:var(--shadow-2);z-index:4}
.live-chip{width:44px;height:44px;border-radius:50%;background:var(--pill-chip);color:var(--pill-ink);display:grid;place-items:center;position:relative;flex:none}
.live-chip .ic{width:22px;height:22px}
.live-dot{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--pill-ink);border:2.5px solid var(--pill-bg)}
.live-txt{flex:1;display:flex;flex-direction:column;line-height:1.2}
.live-txt b{font-weight:800;font-size:16px}
.live-txt small{font-size:13px;color:var(--pill-text-2);font-weight:600}
.live-time{font-weight:800;font-size:24px;letter-spacing:-.01em}
.live-chev{color:var(--pill-text-2);width:20px;height:20px}

.nav{position:absolute;left:0;right:0;bottom:0;height:90px;padding:0 8px 34px;background:var(--nav-bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:3}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-3);font-weight:700;font-size:12px;min-height:56px}
.tab .ic{width:26px;height:26px}
.tab.on{color:var(--text);font-weight:800}
.tab.on .ic{color:var(--accent)}
.nav-slot{position:relative}
.fab{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:var(--fab-bg);color:var(--on-accent);display:grid;place-items:center;
  box-shadow:0 6px 16px -4px color-mix(in srgb,var(--accent) 70%,transparent),0 0 0 4px var(--nav-bg)}
.fab-ic{width:30px;height:30px}

/* ===== Sheet (frame 3) ===== */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:0;top:196px;background:var(--surface);border-radius:28px 28px 0 0;z-index:8;padding:24px 20px 0;box-shadow:0 -12px 40px rgba(30,20,12,.2);overflow:hidden}
.origin-glow{position:absolute;left:50%;bottom:-310px;width:700px;height:700px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 18%,transparent) 0,color-mix(in srgb,var(--accent) 7%,transparent) 26%,transparent 60%);pointer-events:none}
.grabber{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:5px;border-radius:3px;background:var(--line-strong);opacity:.45}
.sheet-hd{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet-hd h2{font-size:26px;line-height:30px}
.sheet-hd p{font-size:14px;color:var(--text-2);font-weight:600;margin-top:2px}
.time-chip{height:44px;padding:0 12px;border-radius:22px;background:var(--surface-2);display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;white-space:nowrap;flex:none}
.time-chip .tnum{color:var(--text-2);font-weight:700}
.tiles{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{height:112px;border-radius:22px;background:var(--c-tint);padding:12px 12px 12px 14px;display:flex;flex-direction:column;align-items:flex-start}
.tile-ic{width:44px;height:44px;border-radius:50%;background:var(--chip-on-tint);color:var(--c-ink);display:grid;place-items:center;margin-bottom:auto}
.tile b{font-weight:800;font-size:17px;color:var(--text);line-height:1.2}
.tile small{font-size:13px;color:var(--text-2);font-weight:600;white-space:nowrap}
.sheet-lbl{position:relative;font-size:13px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px 2px}
.seg-row{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pill-btn{height:52px;border-radius:26px;background:var(--c-tint);color:var(--c-ink);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:16px}
.pill-btn .ic{width:20px;height:20px}
.row-link{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:60px;margin-top:12px;padding:8px 14px 8px 10px;border-radius:20px;background:var(--surface-2)}
.row-link span{flex:1;display:flex;flex-direction:column}
.row-link b{font-weight:800;font-size:16px}
.row-link small{font-size:13px;color:var(--text-2);font-weight:600}
.ic-pouch{width:40px;height:40px;padding:9px;border-radius:14px;background:var(--pump-tint);color:var(--pump-ink)}
.hint{position:relative;font-size:13px;color:var(--text-2);font-weight:600;text-align:center;margin-top:12px}
.hint b{color:var(--accent-ink)}
.fab-x{top:auto;bottom:40px;transform:translateX(-50%) rotate(45deg);z-index:9;box-shadow:0 6px 16px -4px color-mix(in srgb,var(--accent) 70%,transparent),0 0 0 4px var(--surface)}

/* ===== Page header / pager / stats (Timeline) ===== */
.page-hd{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:12px}
.page-hd h1{font-size:32px;line-height:36px}
.page-sub{font-size:14px;color:var(--text-2);font-weight:600}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-1)}
.pager{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:26px;padding:4px;box-shadow:var(--shadow-1)}
.round-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text)}
.round-btn[disabled]{opacity:.38;cursor:default}
.pager-mid{text-align:center;line-height:1.2}
.pager-mid b{display:block;font-size:17px;font-weight:800}
.pager-mid small{font-size:13px;color:var(--text-2);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--c-tint);border-radius:18px;padding:10px 8px 10px 11px;display:flex;flex-direction:column;min-height:80px}
.stat .ic{color:var(--c-ink);width:20px;height:20px;margin-bottom:auto}
.stat b{font-size:17px;font-weight:800;line-height:1.15;white-space:nowrap;margin-top:6px}
.stat small{font-size:12px;color:var(--text-2);font-weight:700;line-height:1.2}

/* ===== TimelineStrip ===== */
.strip{margin-top:12px;padding:14px 14px 10px}
.strip-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.strip-hd b{font-weight:800;font-size:15px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--text-2);font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%}
.lanes{position:relative;display:flex;flex-direction:column;gap:7px}
.lane{display:flex;align-items:center;gap:8px;height:24px}
.lane-ic{width:26px;height:24px;display:grid;place-items:center;color:var(--c-ink);flex:none}
.lane-ic .ic{width:20px;height:20px}
.track{position:relative;flex:1;height:24px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.track-in{position:absolute;top:0;bottom:0;left:6px;right:6px}
.track-in .future{right:-6px}
.future{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--text) 7%,transparent) 5px 6px)}
.blk{position:absolute;top:4px;bottom:4px;border-radius:5px;min-width:5px}
.b-sleep{background:var(--sleep-mid)}
.b-sleep.live{background:repeating-linear-gradient(135deg,var(--sleep-mid) 0 4px,color-mix(in srgb,var(--sleep-mid) 55%,var(--surface)) 4px 7px)}
.b-feed{background:var(--feed-mid)}
.b-pump{background:var(--pump-mid)}
.dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%}
.d-wet{background:var(--surface);border:2.5px solid var(--diaper-mid)}
.d-dirty{background:var(--diaper-mid)}
.nowline{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--accent);border-radius:1px;z-index:2}
.nowline em{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);background:var(--accent-soft);padding:1px 7px;border-radius:9px;font-style:normal;font-size:12px;font-weight:800;color:var(--accent-ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.axis{position:relative;height:16px;margin:8px 6px 0 40px;font-size:12px;font-weight:700;color:var(--text-3)}
.axis span{position:absolute;top:0;transform:translateX(-50%)}
.axis span:nth-child(1){left:0;transform:none}
.axis span:nth-child(2){left:25%}
.axis span:nth-child(3){left:50%}
.axis span:nth-child(4){left:75%}
.axis span:nth-child(5){left:100%;transform:translateX(-100%)}
.list-tight{margin-top:12px}

/* ===== Stash ===== */
.stash-sum{padding:14px 16px 14px}
.stash-total{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stash-total p{margin-top:2px}
.big{font-size:44px;line-height:46px}
.big small{font-size:22px;color:var(--text-2);font-weight:500}
.stash-total .muted{font-size:14px;font-weight:700}
.split{display:flex;gap:3px;height:10px;margin:12px 0 2px;border-radius:5px;overflow:hidden}
.sp-fridge{background:var(--pump-mid)}
.sp-freezer{background:color-mix(in srgb,var(--pump-mid) 38%,var(--surface-2))}
.split-lg{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--text-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.split-lg span{display:flex;align-items:center;gap:6px}
.split-lg b{color:var(--text);font-weight:800;margin-left:auto;padding-left:8px}
.usenext{margin-top:12px;border-radius:24px;background:var(--pump-tint);padding:12px 14px 14px 16px}
.un-top{display:flex;justify-content:space-between;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px 0 9px;border-radius:14px;background:var(--surface);color:var(--pump-ink);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.un-where{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--text-2)}
.un-main{display:flex;gap:14px;align-items:center;margin:8px 0 12px 2px}
.pouch-art{width:48px;height:60px;border-radius:8px 8px 16px 16px;background:color-mix(in srgb,var(--pump-mid) 10%,var(--surface));position:relative;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pump-mid) 45%,transparent)}
.pa-fill{position:absolute;left:0;right:0;bottom:0;height:62%;background:color-mix(in srgb,var(--pump-mid) 34%,var(--surface));border-radius:30% 30% 0 0/6px 6px 0 0}
.pa-cap{position:absolute;top:8px;left:8px;right:8px;height:4px;border-top:1.5px solid color-mix(in srgb,var(--pump-mid) 55%,transparent);border-bottom:1.5px solid color-mix(in srgb,var(--pump-mid) 55%,transparent)}
.un-oz{font-size:32px;line-height:36px}
.un-oz small{font-size:18px;color:var(--text-2);font-weight:500}
.un-meta{font-size:14px;color:var(--text-2);font-weight:600;line-height:1.35}
.un-meta b{color:var(--text);font-weight:800}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:17px}
.btn .ic{width:22px;height:22px}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 14px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.secondary{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.block{width:100%;height:56px}
.srow{min-height:60px;padding:8px 14px 8px 12px}
.list li+li .srow::before{left:64px}
.srow .row-main b{font-size:17px}
.row-t{font-weight:700;color:var(--text-2);font-size:14px;margin-left:4px}
.exp{font-size:12px;font-weight:800;height:28px;padding:0 10px;border-radius:14px;display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);color:var(--text-2);white-space:nowrap;flex:none}
.exp.warn{background:var(--warn-tint);color:var(--warn-ink)}
.exp.ok{background:var(--ok-tint);color:var(--ok-ink)}
.exp.next{background:var(--accent-soft);color:var(--accent-ink)}

/* ===== Memories ===== */
.ms-row{display:flex;gap:10px;margin-right:-20px;overflow:hidden;padding-bottom:2px}
.ms{flex:none;width:140px;border-radius:22px;background:var(--surface);padding:8px 8px 12px;box-shadow:var(--shadow-1);display:flex;flex-direction:column}
.ph{display:block;height:100px;border-radius:16px;position:relative;margin-bottom:8px}
.ms b{font-size:15px;font-weight:800;padding:0 4px}
.ms small{font-size:13px;color:var(--text-2);font-weight:600;padding:0 4px}
.ms-check{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--mem-ink);display:grid;place-items:center}
.ms-next{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.ph-empty{background:var(--mem-tint);display:grid;place-items:center;color:var(--mem-ink)}
.mem-ink{color:var(--mem-ink)}
.ph-a{background:radial-gradient(circle at 74% 26%,#FFF4DA 0 11%,transparent 12%),radial-gradient(ellipse 80% 52% at 34% 112%,#E2AE8F 0 70%,transparent 71%),radial-gradient(ellipse 60% 40% at 90% 120%,#EDC2A8 0 70%,transparent 71%),linear-gradient(170deg,#FBE3CC,#F2C7AB)}
.ph-b{background:radial-gradient(circle at 30% 34%,#FFFFFF 0 9%,transparent 10%),radial-gradient(ellipse 90% 50% at 60% 115%,#B6A8D8 0 70%,transparent 71%),linear-gradient(180deg,#EEE8F7,#D9CFEE)}
.ph-c{background:radial-gradient(circle at 68% 30%,#FAF6E6 0 12%,transparent 13%),radial-gradient(ellipse 70% 46% at 25% 110%,#9CBB93 0 70%,transparent 71%),radial-gradient(ellipse 70% 40% at 85% 118%,#B9CFB1 0 70%,transparent 71%),linear-gradient(175deg,#EAF1E4,#D4E3CC)}
.ph-d{background:radial-gradient(circle at 50% 38%,#FFF7E2 0 18%,transparent 19%),radial-gradient(ellipse 100% 46% at 50% 118%,#E3C46E 0 70%,transparent 71%),linear-gradient(180deg,#FBF1D3,#F1DDA2)}
.ph-e{background:radial-gradient(circle at 36% 30%,#FFF1F3 0 13%,transparent 14%),radial-gradient(ellipse 80% 50% at 70% 112%,#D88DA0 0 70%,transparent 71%),linear-gradient(170deg,#FAE6EA,#F0C9D2)}
.ph-f{background:radial-gradient(circle at 70% 64%,#F6EEE0 0 16%,transparent 17%),radial-gradient(ellipse 70% 44% at 20% 115%,#CDB89B 0 70%,transparent 71%),linear-gradient(170deg,#F3EBDD,#E2D3BC)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pg{aspect-ratio:1/1;border-radius:16px;position:relative;overflow:hidden}
.pg-cap{position:absolute;left:6px;bottom:6px;height:26px;padding:0 9px;border-radius:13px;background:rgba(255,252,247,.92);color:#2B2420;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.pg-cap .ic{color:#7E6211}

/* ===== Settings / Customize ===== */
.push-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;margin:0 -10px}
.back{display:flex;align-items:center;height:44px;color:var(--accent-ink);font-weight:800;font-size:16px;padding-right:8px;justify-self:start}
.back .ic{width:26px;height:26px}
.push-hd h1{font-size:17px;font-weight:800}
.intro{font-size:15px;color:var(--text-2);font-weight:600;margin:6px 4px 18px;line-height:1.4}
.grp-lbl{font-size:13px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px 6px}
.group{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-1);overflow:hidden;margin-bottom:20px}
.srow2{position:relative;display:flex;align-items:center;gap:6px;min-height:58px;padding:5px 12px 5px 0}
.group li+li::before{content:"";position:absolute;top:0;left:92px;right:14px;height:1px;background:var(--line)}
.group li{position:relative}
.grip{width:44px;height:44px;display:grid;place-items:center;color:var(--text-3);flex:none;cursor:grab}
.grip .ic{width:20px;height:20px}
.srow2 .chip-ic{width:38px;height:38px;border-radius:13px;margin-right:6px}
.srow2 .chip-ic .ic{width:21px;height:21px}
.srow2 .row-main b{font-size:16px}
.srow2 .row-main small{font-size:13px}
.tgl{position:relative;width:52px;height:44px;display:grid;place-items:center;flex:none}
.tgl input{position:absolute;inset:0;opacity:0;margin:0}
.tgl span{width:52px;height:32px;border-radius:16px;background:var(--toggle-off);position:relative;display:block}
.tgl span::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.22)}
.tgl input:not(:checked)+span{box-shadow:inset 0 0 0 1px var(--line-strong)}
.tgl input:checked+span{background:var(--accent)}
.tgl input:checked+span::after{left:23px}
.prow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 14px}
.group li+li .prow{}
.group:has(.prow) li+li::before{left:64px}
.muted-ic{color:var(--text-3)}

/* ===== Onboarding ===== */
.ob{padding:6px 24px 0;display:flex;flex-direction:column}
.ob-top{display:flex;justify-content:space-between;align-items:center;height:44px}
.wordmark{font-size:24px;color:var(--accent-ink)}
.steps{display:flex;gap:6px}
.steps i{width:8px;height:8px;border-radius:4px;background:var(--line-strong);opacity:.35}
.steps i.on{width:22px;background:var(--accent);opacity:1}
.ob-h{font-size:38px;line-height:42px;margin:22px 0 20px;letter-spacing:-.02em}
.promise{display:flex;flex-direction:column;gap:6px}
.promise li{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;min-height:40px}
.promise .ic{width:36px;height:36px;padding:8px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink)}
.ob-baby{display:flex;gap:16px;align-items:center;margin-top:24px;padding:14px;background:var(--surface);border-radius:26px;box-shadow:var(--shadow-1)}
.photo-pick{width:104px;height:104px;border-radius:50%;position:relative;flex:none}
.pp-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-ink)}
.pp-ring .ic{width:32px;height:32px}
.pp-add{position:absolute;right:0;bottom:2px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:3px solid var(--surface)}
.pp-add .ic{width:16px;height:16px}
.ob-fields{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.field{display:flex;flex-direction:column;justify-content:center;background:var(--surface-2);border-radius:14px;padding:6px 12px;min-height:54px}
.field>span:first-child{font-size:12px;font-weight:700;color:var(--text-2)}
.field input{font:inherit;font-size:18px;font-weight:800;border:0;background:none;color:var(--text);padding:0;width:100%;outline:none}
.field-v{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}
.field-v .ic{color:var(--text-2)}
.ob-note{display:flex;gap:8px;font-size:13px;color:var(--text-2);font-weight:600;margin:14px 4px 0;line-height:1.4}
.ob-note .ic{margin-top:2px;flex:none}
.ob .btn.block{margin-top:auto}
.btn.ghost{background:none;color:var(--accent-ink);font-size:16px;height:48px}
.block-ghost{width:100%;margin:6px 0 40px}
